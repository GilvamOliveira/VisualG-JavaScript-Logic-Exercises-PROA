<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Gilvam J. T. de Oliveira">
  <meta name="description"
    content="Meteoro de Lógica: catálogo de exercícios de lógica de programação das apostilas Manzano e Faccat, com soluções em VisualG e JavaScript executáveis no navegador.">
  <meta name="theme-color" content="#4969e8">
  <title>Meteoro de Lógica — Exercícios de lógica de programação</title>
  <link rel="icon" href="./img/favicon.webp" type="image/webp">
  <link rel="preconnect" href="https://assets.codepen.io">
  <link rel="stylesheet" href="./css/main.css">
</head>

<body>
  <main>
    <h1 class="sr-only">Meteoro de Lógica — exercícios de lógica de programação</h1>
    <noscript>
      <p class="noscript">Este projeto precisa de JavaScript ativado para navegar e executar os exercícios.</p>
    </noscript>
    <div class="keypad">
      <div class="keypad__base">
        <img src="https://assets.codepen.io/605876/ai-base.png?format=auto&quality=86" alt="" />
      </div>
      <button id="one" class="key keypad__single" aria-label="Abrir o livro Manzano em PDF" title="Livro Manzano (PDF)">
        <span class="key__mask">
          <span class="key__content">
            <span class="key__text"><img src="./img/favicon.webp" alt=""></span>
            <img src="https://assets.codepen.io/605876/keypad-single.png?format=auto&quality=86" alt="" />
          </span>
        </span>
      </button>
      <button id="two" class="key keypad__single" aria-label="Abrir LinkedIn de Gilvam" title="LinkedIn de Gilvam">
        <span class="key__mask">
          <span class="key__content">
            <span class="key__text">Gilvam</span>
            <img src="https://assets.codepen.io/605876/keypad-single.png?format=auto&quality=86" alt="" />
          </span>
        </span>
      </button>
      <button id="three" class="key keypad__single" aria-label="Abrir exercícios Manzano (tecla M)"
        title="Manzano — tecla M">
        <span class="key__mask">
          <span class="key__content">
            <span class="key__text">M · Manz</span>
            <img src="https://assets.codepen.io/605876/keypad-single.png?format=auto&quality=86" alt="" />
          </span>
        </span>
      </button>
      <button id="four" class="key keypad__single" aria-label="Abrir exercícios Faccat (tecla F)"
        title="Faccat — tecla F">
        <span class="key__mask">
          <span class="key__content">
            <span class="key__text">F · Fac</span>
            <img src="https://assets.codepen.io/605876/keypad-single.png?format=auto&quality=86" alt="" />
          </span>
        </span>
      </button>
      <button id="five" class="key keypad__single" aria-label="Abrir os exercícios Faccat em PDF"
        title="Exercícios Faccat (PDF)">
        <span class="key__mask">
          <span class="key__content">
            <span class="key__text"><img src="./img/favicon.webp" alt=""></span>
            <img src="https://assets.codepen.io/605876/keypad-single.png?format=auto&quality=86" alt="" />
          </span>
        </span>
      </button>
    </div>
  </main>

  <script src="./js/main.js"></script>

</body>

</html>
