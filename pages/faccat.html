<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Faccat | Meteoro de Lógica</title>
    <link rel="icon" href="../img/favicon.webp">
    <link rel="stylesheet" href="../css/exercises.css">
</head>

<body data-book="faccat">
    <main class="exercise-app"><a class="back" href="../index.html">← Voltar ao teclado</a>
        <header>
            <p class="eyebrow">Apostila</p>
            <h1>Faccat</h1>
            <p id="summary"></p>
        </header>
        <section id="groups"></section><button class="add" type="button">+ Adicionar exercício</button>
    </main>
    <dialog id="editor">
        <form method="dialog">
            <div class="dialog-head">
                <h2 id="editor-title">Editar exercício</h2><button class="icon" value="cancel">×</button>
            </div><input type="hidden" name="id"><label>Página<input name="page" required></label><label>Capítulo /
                assunto<input name="chapter" required></label><label>Exercício<input name="number"
                    required></label><label>Título curto<input name="title"></label><label>Enunciado<textarea
                    name="prompt" rows="5"></textarea></label>
            <label>Exibir código
                <select name="codeLanguage" id="code-language">
                    <option value="visualg">VisualG</option>
                    <option value="javascript">JavaScript</option>
                </select>
            </label>
            <label class="code-field" data-language="visualg">Código VisualG<textarea name="code"
                    rows="8"></textarea></label>
            <label class="code-field" data-language="javascript">Código JavaScript<textarea name="javascriptCode"
                    rows="8" spellcheck="false"></textarea></label>
            <div class="actions"><button class="secondary" type="button" id="remove">Excluir</button><button
                    class="primary" value="save">Salvar</button></div>
        </form>
        <div class="test-panel">
            <div class="test-panel-head">
                <h3>Testar código</h3>
                <div class="test-actions">
                    <button class="secondary" type="button" id="test-reset">↺ Restaurar original</button>
                    <button class="primary" type="button" id="test-run">▶ Executar</button>
                </div>
            </div>
            <p class="test-hint">Execute o código selecionado. JavaScript roda em um Web Worker isolado; use
                <code>await readLine("pergunta")</code> para entrada e <code>write()</code>,
                <code>writeln()</code> ou <code>console.log()</code> para saída.
            </p>
            <pre class="test-console" id="test-console"></pre>
            <div class="test-input-row" id="test-input-row" hidden>
                <input id="test-input" type="text" autocomplete="off" placeholder="Digite o valor pedido pelo Leia() e pressione Enter">
                <button type="button" id="test-input-send">Enviar</button>
            </div>
        </div>
    </dialog>
    <script src="../data/exercises.js"></script>
    <script src="../data/exercise-details.js"></script>
    <script src="../data/visualg-matches.js"></script>
    <script src="../data/javascript-matches.js"></script>
    <script src="../js/visualg-interpreter.js"></script>
    <script src="../js/javascript-runner.js"></script>
    <script src="../js/exercises.js"></script>
</body>

</html>
